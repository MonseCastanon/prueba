# ===================================================================
# CONFIGURACIÓN SPRING BOOT & SPRING CLOUD
# ===================================================================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:

# ===================================================================
# BASE DE DATOS MONGODB ATLAS
# ===================================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://monse:monse12345@clusterservice.kkvhgst.mongodb.net/prueba?retryWrites=true&w=majority&appName=ClusterService}

# ===================================================================
# BASE DE DATOS RELACIONAL (POSTGRESQL / SF DATASOURCE)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prueba_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mon1327}

# ===================================================================
# PUNTORED / GESTOPAGO API - CREDENCIALES Y SERVIDOR BASE
# ===================================================================
gestopago.api.base-url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.service.url=${GESTOPAGO_SERVICE_URL:https://gestopago.portalventas.net}

# Credenciales del distribuidor
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}

# Llave API opcional (X-API-Key)
gestopago.api.api-key=${GESTOPAGO_API_KEY:}
gestopago.service.api-key=${GESTOPAGO_API_KEY:}

# ===================================================================
# ENDPOINTS DE PUNTORED
# ===================================================================
# Endpoint de Autenticación (POST)
gestopago.endpoints.auth=/sistema/app/jwt-gp/authenticate/

# Endpoint de Catálogo de Productos (GET XML)
gestopago.endpoints.get-product-list=/sistema/service/getProductList.do
gestopago.service.endpoints.cat-product=/sistema/service/getProductList.do

# ===================================================================
# TAREA PROGRAMADA (CRON TASK) - SINCRONIZACIÓN DIARIA A LAS 6:00 AM
# ===================================================================
gestopago.cron.get-product-list=0 0 6 * * *
gestopago.cron.cat-product=0 0 6 * * *
gestopago.cron.timezone=America/Mexico_City

# ===================================================================
# PARÁMETROS DEL NEGOCIO BANCARIO (ONBOARDING)
# ===================================================================
