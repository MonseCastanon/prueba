# ===================================================================
# PUERTO DE LA APLICACIÓN
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# CONFIGURACIÓN SPRING BOOT & SPRING CLOUD
# ===================================================================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:

# Deserialización estricta (rechazar campos desconocidos / mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===================================================================
# BASE DE DATOS MONGODB ATLAS
# ===================================================================
spring.data.mongodb.uri=${MONGO_URI:}

# ===================================================================
# BASE DE DATOS RELACIONAL (POSTGRESQL / SF DATASOURCE)
# ===================================================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# PUNTORED / GESTOPAGO API - CREDENCIALES Y SERVIDOR BASE
# ===================================================================
gestopago.api.base-url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.service.url=${GESTOPAGO_SERVICE_URL:https://gestopago.portalventas.net}

# Credenciales del distribuidor (sin contraseñas por defecto)
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}

# Cifrado de payload (AES-256-CBC con llave e IV en Base64)
gestopago.crypto.aes-secret-key=${GESTOPAGO_AES_SECRET_KEY:}
gestopago.crypto.aes-iv=${GESTOPAGO_AES_IV:}
gestopago.token.encryption-key=${GESTOPAGO_TOKEN_ENC_KEY:}
gestopago.unidad=${GESTOPAGO_UNIDAD:083}

# Llave API opcional (X-API-Key)
gestopago.api.api-key=${GESTOPAGO_API_KEY:}
gestopago.service.api-key=${GESTOPAGO_API_KEY:}

# ===================================================================
# ENDPOINTS DE PUNTORED
# ===================================================================
gestopago.endpoints.auth=${GESTOPAGO_ENDPOINT_AUTH:/sistema/app/jwt-gp/authenticate/}
gestopago.endpoints.get-product-list=${GESTOPAGO_ENDPOINT_CAT:/sistema/service/getProductList.do}
gestopago.service.endpoints.cat-product=${GESTOPAGO_ENDPOINT_CAT:/sistema/service/getProductList.do}
gestopago.endpoints.send-tx=${GESTOPAGO_ENDPOINT_SEND_TX:/sistema/service/sendTx.do}
gestopago.endpoints.confirm-tx=${GESTOPAGO_ENDPOINT_CONFIRM_TX:/sistema/service/confirmTx.do}

# Timeouts Feign para Gestopago SendTx (62s de PuntoRed)
spring.cloud.openfeign.client.config.gestoPagoSendTx.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoSendTx.read-timeout=65000
spring.cloud.openfeign.client.config.gestoPagoSendTx.logger-level=none

# ===================================================================
# TAREAS PROGRAMADAS Y CONCILIACIÓN
# ===================================================================
gestopago.cron.get-product-list=0 0 6 * * *
gestopago.cron.cat-product=0 0 6 * * *
gestopago.cron.timezone=America/Mexico_City
gestopago.conciliacion.cron-rate-ms=30000

# ===================================================================
# PARÁMETROS DEL NEGOCIO BANCARIO (ONBOARDING Y LÍMITES)
# ===================================================================
banco.onboarding.saldo-inicial-default=100.00
banco.onboarding.prefijo-cuenta=9080
banco.onboarding.edad-minima=18

banco.limites.monto-minimo=1.00
banco.limites.monto-maximo-operacion=10000.00
banco.limites.monto-maximo-diario=50000.00

# ===================================================================
# SEGURIDAD JWT (JJWT 0.12.6) - Sin valor hardcodeado por defecto
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===================================================================
# ACTUATOR SEGURO
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.env.enabled=false

# ===================================================================
# API EXTERNA DE GEOGRAFÍA DE MÉXICO
# ===================================================================
mexico.geografia.api.base-url=${MEXICO_GEO_API_BASE_URL:https://raw.githubusercontent.com/cisnerosnow/json-estados-municipios-mexico/master}

# ===================================================================
# DOCUMENTACIÓN OPENAPI / SWAGGER
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
